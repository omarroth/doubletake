name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('git-{0}', github.sha) }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        go: ['1.25.x', stable]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require release tags to reference main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo 'Release tags must point to a commit on main' >&2
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - run: make test-go
      - run: CGO_ENABLED=0 go test -tags no_gstreamer ./...
      - run: CGO_ENABLED=0 go vet ./...

  portable-media:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
      GST_VERSION: '1.26.11'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
      - name: Set up the Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: (Join-Path $env:MSYS2_LOCATION 'ucrt64\bin') >> $env:GITHUB_PATH
      - name: Enable Media Foundation on the Windows Server runner
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Test-Path "$env:WINDIR\System32\mfh264enc.dll")) {
            $feature = Install-WindowsFeature Server-Media-Foundation
            if (-not $feature.Success) { throw 'Could not install Media Foundation' }
          }
      - name: Install macOS GStreamer SDK and runtime
        if: runner.os == 'macOS'
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GST_VERSION"
          runtime="gstreamer-1.0-$GST_VERSION-universal.pkg"
          sdk="gstreamer-1.0-devel-$GST_VERSION-universal.pkg"
          curl -fsSL --retry 3 "$base/$runtime" -o "$runtime"
          curl -fsSL --retry 3 "$base/$sdk" -o "$sdk"
          echo "bd6f3ad26126a6db726608f15622efaec383d672daa0a309775785d42c326f9c  $runtime" | shasum -a 256 -c
          echo "5135a7bc87a75a512f0017aa52e9774d47a5d3eca380210b815d5dc0648bb7bf  $sdk" | shasum -a 256 -c
          sudo installer -pkg "$runtime" -target /
          sudo installer -pkg "$sdk" -target /
          gst=/Library/Frameworks/GStreamer.framework/Versions/1.0
          echo "$gst/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$gst/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - name: Install Windows GStreamer SDK and runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/pkg/windows/$env:GST_VERSION/msvc"
          $sdk = Join-Path $env:RUNNER_TEMP 'gstreamer-sdk'
          $packages = [ordered]@{
            "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi" = '31cbc21fa0950b5c1e79c80959b2799805cb05a7a35953a13a9f790776137605'
            "gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi" = 'af0a0720692052aaf5fb0cf2847ef34a87016ef0f914328d516f049e6c86f587'
          }
          foreach ($package in $packages.Keys) {
            $installer = Join-Path $env:RUNNER_TEMP $package
            Invoke-WebRequest "$base/$package" -OutFile $installer
            if ((Get-FileHash $installer).Hash -ne $packages[$package]) {
              throw "Unexpected checksum for $package"
            }
            $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', "`"$installer`"", '/qn', "TARGETDIR=`"$sdk`"")
            if ($install.ExitCode -ne 0) { throw "$package exited with $($install.ExitCode)" }
          }
          $gst = Get-ChildItem $sdk -Recurse -Filter gst-inspect-1.0.exe | Select-Object -First 1
          if (-not $gst) { throw 'GStreamer SDK is missing gst-inspect-1.0.exe' }
          $lib = Join-Path $gst.Directory.Parent.FullName 'lib'
          # Link against the DLL import libraries. The SDK also carries static
          # plugin archives built with LLVM LTO, which Go rejects in local -L paths.
          Get-ChildItem $lib -Recurse -Filter '*.a' -File | Remove-Item
          $gst.DirectoryName >> $env:GITHUB_PATH
          "PKG_CONFIG_LIBDIR=$(Join-Path $lib 'pkgconfig')" >> $env:GITHUB_ENV
      - name: Build and run the integrated sender
        shell: bash
        run: |
          mkdir -p bin
          go build -o bin/ ./cmd/doubletake
          CGO_ENABLED=0 go build -o bin/ ./cmd/doubletake-ctl
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          "bin/doubletake$suffix" -version
          "bin/doubletake$suffix" ctl -help
          "bin/doubletake-ctl$suffix" -version
      - name: Verify native capture plugin availability
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            gst-inspect-1.0 avfvideosrc >/dev/null
          else
            for plugin in d3d11screencapturesrc wasapi2src; do gst-inspect-1.0 "$plugin" >/dev/null; done
          fi
      - name: Exercise loopback receiver pairing and classic audio
        run: go test ./internal/airplay -run 'Test(ReceiverServerRequiresPairVerifyBeforeSessionRequests|ReceiverFPSAPCompletesSenderExchange|RAOPMatchesLocalVolumeAndPreservesDaemonMute|DiscoveryPreservesLinkLocalIPv6Interface)$' -count=1
      - name: Exercise daemon socket access and exclusive instance ownership
        run: go test ./internal/daemon -run '^Test(RunRejects(SecondDaemonWithoutRemovingLiveSocket|LiveDaemonThatPredatesInstanceLock)|RemoveStaleControlSocket)$' -count=1
      - name: Play local and HTTP media through the daemon and loopback receiver
        shell: bash
        run: |
          for plugin in vp8enc vp8dec matroskamux matroskademux openh264enc rtponviftimestamp vorbisenc vorbisdec rtpL16pay souphttpsrc; do
            gst-inspect-1.0 "$plugin" >/dev/null
          done
          go test ./internal/daemon -run '^TestDaemonPlayMediaSource$' -count=1 -v

  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-universal
            goarch: arm64
            extension: tar.gz
          - runner: windows-2025
            target: windows-x86_64
            goarch: amd64
            extension: zip
            msystem: UCRT64
            cc: gcc
            packages: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-fdk-aac
          - runner: windows-11-arm
            target: windows-arm64
            goarch: arm64
            extension: zip
            msystem: CLANGARM64
            cc: clang
            packages: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-fdk-aac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      TARGET: ${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.goarch }}
      ARCHIVE_EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.packages }}
      - name: Set up the Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          MSYSTEM_NAME: ${{ matrix.msystem }}
          NATIVE_CC: ${{ matrix.cc }}
        run: |
          $mingwBin = Join-Path $env:MSYS2_LOCATION "$($env:MSYSTEM_NAME.ToLowerInvariant())\bin"
          $mingwBin >> $env:GITHUB_PATH
          "MINGW_BIN=$mingwBin" >> $env:GITHUB_ENV
          "CC=$env:NATIVE_CC" >> $env:GITHUB_ENV
      - name: Enable Media Foundation on Windows Server
        if: matrix.runner == 'windows-2025'
        shell: powershell
        run: |
          if (-not (Test-Path "$env:WINDIR\System32\mfh264enc.dll")) {
            $feature = Install-WindowsFeature Server-Media-Foundation
            if (-not $feature.Success) { throw 'Could not install Media Foundation' }
          }
      - name: Build and package native commands
        shell: bash
        run: |
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          version_flags="-s -w -X doubletake/internal/version.Version=$VERSION -X doubletake/internal/version.Commit=$GITHUB_SHA"
          binaries="bin/release/$TARGET"
          mkdir -p "$binaries"
          if [[ "$RUNNER_OS" == macOS ]]; then
            for arch in arm64 amd64; do
              dir="bin/release/darwin-$arch"
              mkdir -p "$dir"
              GOARCH="$arch" go build -trimpath -tags no_gstreamer -ldflags "$version_flags" -o "$dir/doubletake" ./cmd/doubletake
              GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "$version_flags" -o "$dir/doubletake-ctl" ./cmd/doubletake-ctl
            done
            for command in doubletake doubletake-ctl; do
              xcrun lipo -create "bin/release/darwin-arm64/$command" "bin/release/darwin-amd64/$command" -output "$binaries/$command"
              xcrun lipo "$binaries/$command" -verify_arch arm64 x86_64
              codesign --force --sign - --timestamp=none "$binaries/$command"
            done
          else
            go build -trimpath -tags no_gstreamer -ldflags "$version_flags" -o "$binaries/doubletake.exe" ./cmd/doubletake
            CGO_ENABLED=0 go build -trimpath -ldflags "$version_flags" -o "$binaries/doubletake-ctl.exe" ./cmd/doubletake-ctl
            for command in doubletake doubletake-ctl; do
              go version -m "$binaries/$command.exe" | grep -F "GOARCH=$EXPECTED_ARCH"
            done
          fi
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python scripts/package-native-release.py "$VERSION" "$TARGET" "$binaries" dist
      - name: Verify the unpacked release and native capture
        shell: bash
        run: |
          archive="dist/doubletake-$VERSION-$TARGET.$ARCHIVE_EXTENSION"
          mkdir -p bin/unpacked
          suffix=''
          runtime_path=$PATH
          if [[ "$RUNNER_OS" == Windows ]]; then
            suffix=.exe
            python -m zipfile -e "$archive" bin/unpacked
            # Smoke-test the archive with only the system runtime on PATH.
            runtime_path="$(cygpath -u "$WINDIR")/System32"
          else
            tar -xzf "$archive" -C bin/unpacked
            codesign --verify --all-architectures bin/unpacked/doubletake
            codesign --verify --all-architectures bin/unpacked/doubletake-ctl
          fi
          expected_commit=$(git rev-parse --short=12 HEAD)
          for command in doubletake doubletake-ctl; do
            binary="bin/unpacked/$command$suffix"
            PATH="$runtime_path" "$binary" -help >/dev/null
            reported=$(PATH="$runtime_path" "$binary" -version)
            grep -F "$VERSION" <<< "$reported"
            grep -F "$expected_commit" <<< "$reported"
          done
          cmp LICENSE bin/unpacked/LICENSE
          cmp COPYING.GPL bin/unpacked/COPYING.GPL
          go test -tags no_gstreamer ./internal/airplay -run '^TestNativeDesktopPattern$' -count=1 -v
      - name: Verify the optional Windows AAC-ELD runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin/aac-test
          cp "$(cygpath -u "$MINGW_BIN")/libfdk-aac-2.dll" bin/aac-test/
          go test -c -tags no_gstreamer -o bin/aac-test/airplay.test.exe ./internal/airplay
          bin/aac-test/airplay.test.exe -test.run '^TestFDKAACELDEncodesRawFrame$' -test.v | tee bin/aac-test/output.log
          grep -F -- '--- PASS: TestFDKAACELDEncodesRawFrame' bin/aac-test/output.log
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/doubletake-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error

  build-gstreamer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    needs: test
    steps:
      - name: Install Ubuntu 20.04 build and runtime dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkg-config binutils file bash-completion \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfdk-aac-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            gstreamer1.0-pulseaudio pulseaudio pulseaudio-utils

      - uses: actions/checkout@v7

      - name: Allow Git access from container build steps
        # Checkout configures a temporary HOME; later steps need their own trust entry.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Verify minimum plugin availability
        run: |
          gst-inspect-1.0 x264enc >/dev/null
          gst-inspect-1.0 rtponviftimestamp >/dev/null
          gst-inspect-1.0 pulsesrc >/dev/null
          gst-inspect-1.0 avdec_h264 >/dev/null
          gst-inspect-1.0 avdec_alac >/dev/null
          gst-inspect-1.0 libde265dec >/dev/null

      - name: Test default AAC-ELD and ALAC-only builds
        run: |
          make test
          make test BUILD_TAGS=
          CGO_ENABLED=1 go vet -tags 'fdk_aac' ./...

      - name: Race checks
        if: matrix.target == 'linux-x86_64'
        run: CGO_ENABLED=1 go test -race -tags 'fdk_aac' ./...

      - name: Check for reachable Go vulnerabilities
        if: matrix.target == 'linux-x86_64'
        run: CGO_ENABLED=1 go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags 'fdk_aac' ./...

      - name: Test audio output lifetime and volume on a private server
        run: |
          scripts/test-audio-output.sh
          BUILD_TAGS='' scripts/test-audio-output.sh
          BUILD_TAGS=no_gstreamer scripts/test-audio-output.sh

      - name: Build and package both commands
        run: make release TARGET=${{ matrix.target }}

      - name: Verify minimum-runtime compatibility and version
        run: |
          cd bin/release/${{ matrix.target }}
          ldd ./doubletake | grep -F libgstreamer-1.0.so.0
          if ldd ./doubletake | grep -E 'not found|libfdk'; then
            echo 'Release must resolve required libraries and load FDK-AAC at runtime' >&2
            exit 1
          fi
          ./doubletake -help >/dev/null
          ./doubletake -version | grep -F "$VERSION"
          expected_commit=$(git rev-parse --short=12 HEAD)
          ./doubletake -version | grep -F "$expected_commit"
          file ./doubletake-ctl | grep -F 'statically linked'
          ./doubletake-ctl -help >/dev/null
          ./doubletake-ctl -version | grep -F "$VERSION"
          ./doubletake-ctl -version | grep -F "$expected_commit"
          required_glibc=$(readelf --version-info ./doubletake | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' | sort -V | tail -1)
          test -n "$required_glibc"
          dpkg --compare-versions "$required_glibc" le 2.31

      - name: Verify package layout, installation, and reproducibility
        run: scripts/test-release-package.sh "dist/doubletake-${VERSION}-${{ matrix.target }}.tar.gz" ${{ matrix.target }}

      - name: Test bash completion against the built commands
        run: scripts/test-bash-completion.sh bin/release/${{ matrix.target }}/doubletake bin/release/${{ matrix.target }}/doubletake-ctl

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/doubletake-*.tar.gz
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: [build-gstreamer, build-native]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release
          merge-multiple: true
      - name: Validate packages and create checksums
        run: |
          scripts/release-checksums.sh release "$VERSION" linux-x86_64 linux-arm64 macos-universal windows-x86_64 windows-arm64
          cd release
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release/*
          if-no-files-found: error

  desktop-playback:
    runs-on: ubuntu-24.04
    needs: build-gstreamer
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        guest: [ubuntu-x11, debian-wayland]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/download-artifact@v8
        with:
          name: release-assets-linux-x86_64
          path: dist
      - name: Build the local test receiver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          make doubletake-test-receiver BUILD_TAGS=
      - name: Capture X11 in the Ubuntu VM
        if: matrix.guest == 'ubuntu-x11'
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils dbus-daemon pulseaudio pulseaudio-utils \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gstreamer1.0-tools gstreamer1.0-libav gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-pulseaudio
          scripts/desktop-test/run.sh x11 "dist/doubletake-$VERSION-linux-x86_64.tar.gz" \
            bin/doubletake-test-receiver desktop-report
      - name: Boot Debian and capture Wayland inside the guest
        if: matrix.guest == 'debian-wayland'
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          if [[ -c /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          image=debian-13-genericcloud-amd64.qcow2
          base=https://cloud.debian.org/images/cloud/trixie/latest
          curl -fsSL --retry 3 "$base/$image" -o "$image"
          curl -fsSL --retry 3 "$base/SHA512SUMS" -o SHA512SUMS
          awk -v image="$image" '$2 == image {print}' SHA512SUMS | sha512sum --check
          scripts/desktop-test/linux-vm.sh wayland "$image" "dist/doubletake-$VERSION-linux-x86_64.tar.gz" \
            bin/doubletake-test-receiver desktop-report
      - name: Upload desktop measurements and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-playback-${{ matrix.guest }}
          path: desktop-report/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [package, desktop-playback, portable-media]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release-notes.sh "$RELEASE_TAG" > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/doubletake-*-linux-x86_64.tar.gz
            release/doubletake-*-linux-arm64.tar.gz
            release/doubletake-*-macos-universal.tar.gz
            release/doubletake-*-windows-x86_64.zip
            release/doubletake-*-windows-arm64.zip
            release/SHA256SUMS
