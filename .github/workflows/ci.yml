name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: ""
          - runner: ubuntu-24.04-arm
            suffix: "-arm64"
    runs-on: ${{ matrix.runner }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build doubletake
        run: make doubletake-release

      - name: Build doubletake-ctl
        run: make doubletake-ctl-release

      - name: Build doubletake-test-receiver
        run: make doubletake-test-receiver-release

      - name: Bundle manpages
        if: matrix.suffix == ''
        run: make manpages-release

      - name: Add architecture suffix
        if: matrix.suffix != ''
        run: |
          mv doubletake "doubletake${{ matrix.suffix }}"
          mv doubletake-ctl "doubletake-ctl${{ matrix.suffix }}"
          mv doubletake-test-receiver "doubletake-test-receiver${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets${{ matrix.suffix }}
          path: |
            doubletake${{ matrix.suffix }}
            doubletake-ctl${{ matrix.suffix }}
            doubletake-test-receiver${{ matrix.suffix }}
            doubletake-manpages.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets*
          merge-multiple: true

      - name: Extract release notes from tag
        id: notes
        run: |
          # Re-fetch the tag to ensure the annotated tag object is present
          git fetch origin tag "${GITHUB_REF_NAME}" --force --no-tags
          NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --format='%B' "${GITHUB_REF_NAME}")
          fi
          {
            echo 'RELEASE_NOTES<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.RELEASE_NOTES }}
          files: |
            doubletake
            doubletake-ctl
            doubletake-test-receiver
            doubletake-arm64
            doubletake-ctl-arm64
            doubletake-test-receiver-arm64
            doubletake-manpages.tar.gz
