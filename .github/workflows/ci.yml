name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  build-gstreamer:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: ""
          - runner: ubuntu-24.04-arm
            suffix: "-arm64"
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    needs: test
    steps:
      - name: Install Ubuntu 20.04 GStreamer build and runtime dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkg-config binutils \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            gstreamer1.0-pulseaudio pulseaudio-utils

      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test linked GStreamer backend
        run: make test-gstreamer

      - name: Build dynamically linked doubletake
        run: make doubletake-release

      - name: Verify minimum-runtime compatibility
        run: |
          gst-inspect-1.0 x264enc >/dev/null
          gst-inspect-1.0 rtponviftimestamp >/dev/null
          ldd ./doubletake | grep -F libgstreamer-1.0.so.0
          ./doubletake -help >/dev/null
          if readelf --version-info ./doubletake | grep -Eq 'Name: GLIBC_2\.(3[2-9]|[4-9][0-9])'; then
            echo "doubletake requires a glibc newer than Ubuntu 20.04" >&2
            exit 1
          fi

      - name: Add architecture suffix
        if: matrix.suffix != ''
        run: mv doubletake "doubletake${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-gstreamer${{ matrix.suffix }}
          path: doubletake${{ matrix.suffix }}

  build-ctl:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: ""
          - runner: ubuntu-24.04-arm
            suffix: "-arm64"
    runs-on: ${{ matrix.runner }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static doubletake-ctl
        run: make doubletake-ctl-release

      - name: Verify static control binary
        run: |
          file ./doubletake-ctl | grep -F 'statically linked'

      - name: Bundle manpages
        if: matrix.suffix == ''
        run: make manpages-release

      - name: Add architecture suffix
        if: matrix.suffix != ''
        run: |
          mv doubletake-ctl "doubletake-ctl${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-ctl${{ matrix.suffix }}
          path: |
            doubletake-ctl${{ matrix.suffix }}
            doubletake-manpages.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-gstreamer, build-ctl]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true

      - name: Extract release notes from tag
        id: notes
        run: |
          # Re-fetch the tag to ensure the annotated tag object is present
          git fetch origin tag "${GITHUB_REF_NAME}" --force --no-tags
          NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --format='%B' "${GITHUB_REF_NAME}")
          fi
          {
            echo 'RELEASE_NOTES<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.RELEASE_NOTES }}
          files: |
            doubletake
            doubletake-ctl
            doubletake-arm64
            doubletake-ctl-arm64
            doubletake-manpages.tar.gz
